<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MI PÁGINA WEB</title>
        <link id="EstilosPagina" rel="stylesheet" href="./CSS/CSS Contacto.css">
    <script src="./JavaScript/Script Contacto.js" defer></script>
    <script src="./JavaScript/Script ModoOscuro.js" defer></script>
</head>
    <body onload="fInicio()">
        <div class="contenedor">
             <header>
                <h1>Contacto</h1>
                <h3>Rellena este formulario para contactarnos.</h3>
            </header>
            <nav>
                <ol>
                    <li>
                        <a href="./MiPaginaWeb Viajes.html">Inicio</a>
                    </li>
                    <li>
                        <a href="./MiPaginaWeb Lugares.html">Lugares</a>
                    </li>
                    <li>
                        <a href="./MiPaginaWeb Favorito.html">Mi Favorito</a>
                    </li>
                    <li>
                        <a href="./MiPaginaWeb Contacto.html">Contacto</a>
                    </li>
                </ol>
            </nav>
            <main>
                <form>
                    <fieldset>
                        <legend>Datos Personales</legend>
                        <label>Nombre:
                            <input type="text" size="30" maxlength="20" required>
                        </label>
                        <label>Apellidos:
                            <input type="text" size="30" maxlength="50" required>
                        </label>
                        <label>Telefono:
                            <input type="text" pattern="[0-9]{9}" size="30" maxlength="9" minlength="9">
                        </label>
                        <label>Email:
                            <input type="text" size="30" maxlength="50" required>
                        </label>
                        <input class="enviar" type="submit" value="Enviar">
                    </fieldset>
                </form>
            </main>
            <aside>
                <label class="darkmodebutton">
                    <p>Modo Oscuro</p>
                    <input id="darkmode" type="checkbox" onclick="fdarkmode()">
                </label>
                <h3>Próximas novedades:</h3>
                <ul>
                    <li>Egipto</li>
                    <li>París</li>
                    <li>México</li>
                </ul>
            </aside>
            <footer>
                <h3>1ºASIR Adrián González Amador IES Canarias</h3>
            </footer>
        </div>
    </body>
</html>
